<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibrasConnect - Apresentação Oficial</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.js"></script>
    <style>
      :root {
        --primary: #2563eb;
        --accent: #f59e0b;
        --bg: #0f172a;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: white;
        margin: 0;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 15px 30px;
        background: rgba(30, 41, 59, 0.8);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--primary);
      }

      main {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 20px;
        padding: 20px;
        flex: 1;
      }

      /* Área da Apresentadora */
      .presentation-area {
        position: relative;
        background: #000;
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
      }
      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: scaleX(-1);
      }

      /* Legenda em Tempo Real */
      .subtitle-area {
        position: absolute;
        bottom: 40px;
        left: 0;
        right: 0;
        text-align: center;
        z-index: 10;
      }
      #current-sentence {
        background: rgba(0, 0, 0, 0.85);
        padding: 20px 40px;
        border-radius: 15px;
        font-size: 2.2rem;
        color: #fff;
        border-bottom: 5px solid var(--primary);
        display: inline-block;
        min-width: 50%;
        max-width: 90%;
        word-wrap: break-word;
      }

      /* Painel Lateral */
      .control-panel {
        background: #1e293b;
        border-radius: 20px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        overflow-y: auto;
      }
      .instruction {
        font-size: 0.9rem;
        color: #94a3b8;
        margin-top: 0;
      }

      .action-btn {
        padding: 15px;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        font-size: 1rem;
        transition: 0.3s;
      }
      .btn-speak {
        background: var(--primary);
        color: white;
      }
      .btn-clear {
        background: #475569;
        color: white;
      }
      .btn-speak:hover {
        background: #3b82f6;
        transform: translateY(-2px);
      }

      /* Caixa de Texto Livre */
      .free-text-box {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid #334155;
        padding: 15px;
        border-radius: 12px;
        margin-top: 10px;
      }
      .free-text-box h4 {
        margin: 0 0 5px 0;
        color: var(--accent);
      }
      .input-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .input-group input {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #0f172a;
        color: white;
        font-size: 1rem;
        outline: none;
      }
      .input-group input:focus {
        border-color: var(--accent);
      }
      .btn-free {
        background: var(--accent);
        color: white;
        border: none;
        padding: 0 20px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }
      .btn-free:hover {
        background: #d97706;
      }

      #live-detection {
        font-size: 1.2rem;
        color: var(--accent);
        font-weight: bold;
        text-align: center;
      }

      .loading-overlay {
        position: fixed;
        inset: 0;
        background: #0f172a;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading-overlay">
      <h2>Preparando Apresentação...</h2>
      <p>Iniciando câmera e IA</p>
    </div>

    <header>
      <h2 style="margin: 0">✨ Apresentação em Libras</h2>
      <div id="live-detection">Aguardando sinal...</div>
    </header>

    <main>
      <div class="presentation-area">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>

        <div class="subtitle-area">
          <div id="current-sentence">...</div>
        </div>
      </div>

      <div class="control-panel">
        <h3>Montar Frase por Sinais</h3>
        <p class="instruction">
          Faça o sinal para adicionar a palavra na legenda.
        </p>

        <button class="action-btn btn-speak" onclick="speakFullSentence()">
          🔊 LER FRASE (VOZ)
        </button>
        <button class="action-btn btn-clear" onclick="clearSentence()">
          🗑️ LIMPAR TELA
        </button>

        <div class="free-text-box">
          <h4>Teclado Livre</h4>
          <p class="instruction">
            Para responder perguntas ou falar fora do roteiro:
          </p>
          <div class="input-group">
            <input
              type="text"
              id="free-input"
              placeholder="Digite sua frase aqui..."
              onkeypress="handleEnter(event)"
            />
            <button class="btn-free" onclick="speakFreeText()">FALAR</button>
          </div>
        </div>

        <div style="margin-top: 10px">
          <h4 style="color: #cbd5e1; margin-bottom: 5px">Sinais da IA:</h4>
          <ul
            id="sign-list"
            style="
              font-size: 0.85rem;
              color: #94a3b8;
              margin-top: 0;
              padding-left: 20px;
            "
          ></ul>
        </div>
      </div>
    </main>

    <script>
      let model;
      let sentence = [];
      let lastDetectedSign = "";
      let detectionCounter = 0;
      let isWriting = false;

      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const sentenceDisplay = document.getElementById("current-sentence");
      const liveDetection = document.getElementById("live-detection");

      // DICA: Vocês podem colocar FRASES INTEIRAS no lugar das palavras!
      // Exemplo: fist: "Bom dia a todos, meu nome é Maria"
      const SIGN_MAP = {
        fist: "Olá",
        open: "Todos",
        thumb_up: "Bom dia",
        point: "Eu",
        peace: "Paz",
        rock: "Amo",
        ok: "Libras",
      };

      Object.values(SIGN_MAP).forEach((v) => {
        const li = document.createElement("li");
        li.innerText = v;
        document.getElementById("sign-list").appendChild(li);
      });

      async function setupCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 },
          audio: false,
        });
        video.srcObject = stream;
        return new Promise(
          (resolve) => (video.onloadedmetadata = () => resolve(video)),
        );
      }

      function getGesture(landmarks) {
        const finger = (tip, pip) => landmarks[tip][1] < landmarks[pip][1];
        const i = finger(8, 6);
        const m = finger(12, 10);
        const r = finger(16, 14);
        const p = finger(20, 18);
        const t = landmarks[4][1] < landmarks[3][1];

        if (i && m && !r && !p) return "peace";
        if (i && p && !m && !r) return "rock";
        if (i && !m && !r && !p) return "point";
        if (
          Math.hypot(
            landmarks[8][0] - landmarks[4][0],
            landmarks[8][1] - landmarks[4][1],
          ) < 30
        )
          return "ok";
        if (t && !i && !m && !r && !p) return "thumb_up";
        if (i && m && r && p) return "open";
        if (!i && !m && !r && !p) return "fist";
        return null;
      }

      async function detect() {
        const predictions = await model.estimateHands(video);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (predictions.length > 0) {
          const gesture = getGesture(predictions[0].landmarks);

          if (gesture) {
            const word = SIGN_MAP[gesture];
            liveDetection.innerText = "Sinal: " + word;

            if (word === lastDetectedSign) {
              detectionCounter++;
            } else {
              lastDetectedSign = word;
              detectionCounter = 0;
              isWriting = false;
            }

            if (detectionCounter > 30 && !isWriting) {
              addWord(word);
              isWriting = true;
            }
          }
        } else {
          liveDetection.innerText = "Aguardando sinal...";
          lastDetectedSign = "";
          detectionCounter = 0;
        }
        requestAnimationFrame(detect);
      }

      // Lógica de Sinais
      function addWord(word) {
        sentence.push(word);
        sentenceDisplay.innerText = sentence.join(" ");
        piscarLegenda();
      }

      function speakFullSentence() {
        const text = sentence.join(" ");
        if (!text) return;
        falarTexto(text);
      }

      function clearSentence() {
        sentence = [];
        sentenceDisplay.innerText = "...";
      }

      // LÓGICA NOVA: TEXTO LIVRE
      function speakFreeText() {
        const input = document.getElementById("free-input");
        const text = input.value.trim();
        if (!text) return;

        // Mostra na tela grande para todos lerem
        sentenceDisplay.innerText = text;
        piscarLegenda();

        // Fala no som do notebook
        falarTexto(text);

        // Limpa o campo para a próxima frase
        input.value = "";
        // Limpa a memória de palavras dos sinais para não misturar
        sentence = [];
      }

      // Permite apertar "Enter" para enviar o texto livre
      function handleEnter(event) {
        if (event.key === "Enter") {
          speakFreeText();
        }
      }

      // Funções Auxiliares
      function piscarLegenda() {
        sentenceDisplay.style.color = "#f59e0b"; // Fica laranja
        setTimeout(() => {
          sentenceDisplay.style.color = "white";
        }, 400); // Volta pro branco
      }

      function falarTexto(text) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = "pt-BR";
        speech.rate = 1.0; // Velocidade da voz normal
        window.speechSynthesis.speak(speech);
      }

      async function init() {
        try {
          await setupCamera();
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          model = await handpose.load();
          document.getElementById("loading").style.display = "none";
          detect();
        } catch (e) {
          alert(
            "Erro ao acessar a câmera. Permita o uso da câmera no navegador.",
          );
        }
      }

      init();
    </script>
  </body>
</html>
